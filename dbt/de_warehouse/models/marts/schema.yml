version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_date
    columns: 
      - name: date_key
        tests: 
          - not_null
          - unique
  
  - name: fact_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_key
        tests: 
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
              
      - name: date_key
        tests: 
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      